[project]
name = "streamstats"
version = "0.1.0"
description = "Streaming analysis of CSV and JSONL events"
readme = "README.md"

requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.14.1",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
